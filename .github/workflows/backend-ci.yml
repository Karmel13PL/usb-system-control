name: Backend CI

on:
  push:
    branches:
      - develop
      - production
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - develop
      - production

jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/usb_system_control?schema=public

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
